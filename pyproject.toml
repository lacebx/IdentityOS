[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identityos"
version = "2.0.0"
description = "Portable AI identity layer — persistent, composable AI identities for LLM applications."
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
authors = [
    {name = "IdentityOS Contributors"},
]

requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "jinja2>=3.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
identity = "cli.main:main"
identitybench = "identitybench.cli:main"

[project.urls]
Homepage = "https://github.com/lacebx/IdentityOS"
Repository = "https://github.com/lacebx/IdentityOS"

[tool.hatch.build]
include = [
    "identityos/**",
    "core/**",
    "runtime/**",
    "adapters/**",
    "identity_graph/**",
    "cli/**",
    "identitybench/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
