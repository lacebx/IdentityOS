<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IdentityOS Live Browser Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 350px;
      padding: 16px;
      margin: 0;
    }
    h1 { font-size: 16px; margin: 0 0 12px; color: #333; }
    .status { padding: 8px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
    .status.connected { background: #e8f5e9; color: #2e7d32; }
    .status.disconnected { background: #fce4ec; color: #c62828; }
    .status.connecting { background: #fff3e0; color: #ef6c00; }
    button { width: 100%; padding: 8px 12px; margin: 4px 0; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; text-align: left; }
    button:hover { background: #f5f5f5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: #1976d2; color: white; border-color: #1976d2; }
    button.primary:hover { background: #1565c0; }
    .section { margin-bottom: 16px; }
    .section h3 { font-size: 13px; color: #666; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .tabs-list { max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
    .tab-item { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; }
    .tab-item:hover { background: #f5f5f5; }
    .tab-item.active { background: #e3f2fd; font-weight: 500; }
    .tab-item .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-item .url { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hidden { display: none !important; }
    .log { font-family: monospace; font-size: 11px; background: #f5f5f5; padding: 8px; border-radius: 4px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>IdentityOS Live Browser Bridge</h1>
  
  <div class="section">
    <h3>Connection</h3>
    <div id="status" class="status disconnected">Disconnected</div>
    <button id="btnConnect" class="primary" onclick="connect()">Connect to IdentityOS</button>
    <button id="btnDisconnect" class="hidden" onclick="disconnect()">Disconnect</button>
  </div>

  <div class="section">
    <h3>Tabs</h3>
    <button id="btnListTabs" onclick="listTabs()" disabled>List Open Tabs</button>
    <button id="btnActiveTab" onclick="getActiveTab()" disabled>Get Active Tab</button>
    <div id="tabsList" class="tabs-list"></div>
  </div>

  <div class="section">
    <h3>Page Actions</h3>
    <button id="btnSnapshot" onclick="takeSnapshot()" disabled>Snapshot Current Page</button>
    <button id="btnNavigate" onclick="promptNavigate()" disabled>Navigate to URL</button>
  </div>

  <div class="section">
    <h3>Logs</h3>
    <div id="log" class="log"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
