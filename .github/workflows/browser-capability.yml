name: Browser Capability

on:
  pull_request:
    branches: [main]
    paths:
      - "core/capabilities/browser/**"
      - "runtime/sensitive.py"
      - "runtime/orchestrator.py"
      - "tests/test_browser_security.py"
      - "pyproject.toml"
      - ".github/workflows/browser-capability.yml"
  push:
    branches: [main]
    paths:
      - "core/capabilities/browser/**"
      - "runtime/sensitive.py"
      - "runtime/orchestrator.py"
      - "tests/test_browser_security.py"
      - "pyproject.toml"
      - ".github/workflows/browser-capability.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Run hermetic browser tests
        run: python -m pytest tests/test_browser_security.py --run-browser -v --tb=short
