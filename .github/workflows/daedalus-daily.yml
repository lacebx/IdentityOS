name: Daedalus Daily Engineering Report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Load benchmark data from cache
        uses: actions/cache@v4
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-daedalus-daily-${{ github.run_id }}
          restore-keys: |
            benchmark-daedalus-

      - name: Run recent IdentityBench smoke suite (if API keys available)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
        run: |
          identity create --name "DaedalusDaily" --id daedalus-daily --persona "engineering" 2>&1 || true
          identitybench run daedalus-daily --mode smoke --seed 42 2>&1 | tee /tmp/daily-benchmark.txt || true

      - name: Generate Daedalus daily report
        id: report
        run: |
          python scripts/daedalus_actions.py report --open-issue 2>&1 | tee /tmp/daedalus-report.txt
          echo "REPORT=$(cat /tmp/daedalus-report.txt | head -5)" >> $GITHUB_OUTPUT

      - name: Comment on existing daily issue if open
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daedalus',
              per_page: 5
            });
            const today = new Date().toISOString().slice(0, 10);
            const todaysIssue = issues.find(i => i.title.includes(today));
            if (todaysIssue) {
              const fs = require('fs');
              let body = '';
              try {
                body = fs.readFileSync('/tmp/daedalus-report.txt', 'utf8');
              } catch(e) {
                body = 'Daedalus report generated.';
              }
              await github.rest.issues.createComment({
                issue_number: todaysIssue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Updated Report\n```\n' + body.slice(0, 3000) + '\n```\n' + '— Daedalus\nLace\'s Engineering Partner\nIdentityOS'
              });
            }
