name: Daedalus PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  REVIEW_IDENTITY: "daedalus"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch base branch for diff
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=50

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Run Daedalus PR review
        id: daedalus
        run: |
          python scripts/daedalus_review.py \
            --diff /tmp/pr.diff \
            --repo "${{ github.repository }}" \
            --pr-number ${{ github.event.pull_request.number }} \
            --head-ref "${{ github.head_ref }}" \
            --base-ref "${{ github.base_ref }}" \
            --title "${{ github.event.pull_request.title }}" \
            --output /tmp/daedalus-review.md \
            --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Restore benchmark identity from cache
        uses: actions/cache@v4
        id: identity-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-daedalus-${{ github.base_ref }}-${{ hashFiles('identitybench/**/*.py') }}
          restore-keys: |
            benchmark-daedalus-${{ github.base_ref }}-
            benchmark-daedalus-

      - name: Create benchmark identity (first run only)
        if: steps.identity-cache.outputs.cache-hit != 'true'
        run: |
          identity create --name "DaedalusBench" --id daedalus-bench --persona "engineering" 2>&1 || true
          echo "Benchmark identity created."

      - name: Run unit tests (ignore pre-existing test_cross_app_continuity issue)
        run: python -m pytest tests/ --ignore=tests/test_cross_app_continuity.py --ignore=tests/legacy -q --tb=short 2>&1 | tee /tmp/test-results.txt || true

      - name: Run IdentityBench smoke suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
        run: |
          identitybench run daedalus-bench --mode smoke --seed 42 2>&1 | tee /tmp/benchmark-results.txt || echo "Benchmark skipped (API keys may be unavailable)"

      - name: Append benchmark results to review
        run: |
          if [ -f /tmp/test-results.txt ]; then
            echo -e "\n## Test Results\n\`\`\`" >> /tmp/daedalus-review.md
            tail -20 /tmp/test-results.txt >> /tmp/daedalus-review.md
            echo -e "\`\`\`" >> /tmp/daedalus-review.md
          fi
          if [ -f /tmp/benchmark-results.txt ]; then
            echo -e "\n## Benchmark Results\n\`\`\`" >> /tmp/daedalus-review.md
            tail -20 /tmp/benchmark-results.txt >> /tmp/daedalus-review.md
            echo -e "\`\`\`" >> /tmp/daedalus-review.md
          fi

      - name: Comment Daedalus review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('/tmp/daedalus-review.md', 'utf8');
            } catch(e) {
              body = '## Daedalus Review\n_Daedalus was unable to complete the review._\n';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
