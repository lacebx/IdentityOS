name: Daedalus PR Review

# The privileged job always executes code from the trusted base revision. The
# pull request is consumed only as inert diff text, so fork authors cannot run
# code with repository secrets or a write-capable token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  REVIEW_IDENTITY: "daedalus"

concurrency:
  group: identityos-provider
  cancel-in-progress: false
  queue: max

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trusted review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download pull request diff as inert data
        uses: actions/github-script@v7
        env:
          DIFF_PATH: /tmp/pr.diff
        with:
          script: |
            const fs = require('fs');
            const response = await github.request(
              'GET /repos/{owner}/{repo}/pulls/{pull_number}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                headers: {accept: 'application/vnd.github.v3.diff'}
              }
            );
            if (typeof response.data !== 'string') {
              throw new Error('GitHub did not return a textual pull request diff');
            }
            const bytes = Buffer.byteLength(response.data, 'utf8');
            if (bytes > 5 * 1024 * 1024) {
              throw new Error(`Pull request diff is too large to review safely (${bytes} bytes)`);
            }
            fs.writeFileSync(process.env.DIFF_PATH, response.data, {mode: 0o600});
            core.info(`Downloaded ${response.data.split('\n').length} diff lines`);

      - name: Record independent check evidence
        uses: actions/github-script@v7
        env:
          RESULTS_PATH: /tmp/test-results.txt
        with:
          script: |
            const fs = require('fs');
            const sha = context.payload.pull_request.head.sha;
            const response = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100
            });
            const lines = [
              `Untrusted head SHA: ${sha}`,
              'Pull request code is tested only by separate read-only jobs.',
              ...response.data.check_runs
                .filter(run => run.name !== 'review')
                .map(run => `${run.name}: ${run.conclusion || run.status}`)
            ];
            fs.writeFileSync(process.env.RESULTS_PATH, lines.join('\n') + '\n', {mode: 0o600});

      - name: Run Daedalus review against trusted code
        id: daedalus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_HEAD_REF: ${{ github.event.pull_request.head.label }}
          REVIEW_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REVIEW_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python scripts/daedalus_review.py \
            --diff /tmp/pr.diff \
            --repo "$REVIEW_REPOSITORY" \
            --pr-number "$REVIEW_PR_NUMBER" \
            --head-ref "$REVIEW_HEAD_REF" \
            --base-ref "$REVIEW_BASE_REF" \
            --title "$REVIEW_TITLE" \
            --output /tmp/daedalus-review.md \
            --test-results /tmp/test-results.txt

      - name: Publish or update Daedalus review
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- daedalus-review -->';
            let review;
            try {
              review = fs.readFileSync('/tmp/daedalus-review.md', 'utf8');
            } catch (error) {
              review = '## Daedalus Review\n\nDaedalus could not produce a review artifact.';
            }
            const body = `${marker}\n${review}`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const prior = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Apply Daedalus readiness labels
        uses: actions/github-script@v7
        env:
          REVIEW_STATUS: ${{ steps.daedalus.outputs.status }}
        with:
          github-token: ${{ github.token }}
          script: |
            const status = process.env.REVIEW_STATUS;
            const labels = ['daedalus-reviewed'];
            if (status === 'NEEDS_WORK') labels.push('needs-changes');
            if (status === 'NOT_READY') labels.push('blocked');
            if (status === 'READY') labels.push('ready-to-merge');

            for (const label of ['needs-changes', 'blocked', 'ready-to-merge']) {
              try {
                await github.rest.issues.removeLabel({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels
            });
