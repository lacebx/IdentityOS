name: Daedalus PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  REVIEW_IDENTITY: "daedalus"

jobs:
  review:
    runs-on: ubuntu-latest
    concurrency:
      group: identityos-provider-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch base branch for diff
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=50

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/test_cross_app_continuity.py -q --tb=short 2>&1 | tee /tmp/test-results.txt

      - name: Run Daedalus PR review (static + AI analysis)
        id: daedalus
        env:
          DAEDALUS_GITHUB_TOKEN: ${{ secrets.DAEDALUS_GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          python scripts/daedalus_review.py \
            --diff /tmp/pr.diff \
            --repo "${{ github.repository }}" \
            --pr-number ${{ github.event.pull_request.number }} \
            --head-ref "${{ github.head_ref }}" \
            --base-ref "${{ github.base_ref }}" \
            --title "${{ github.event.pull_request.title }}" \
            --output /tmp/daedalus-review.md \
            --token "${{ secrets.DAEDALUS_GITHUB_TOKEN }}" \
            --test-results /tmp/test-results.txt

      - name: Daedalus posts review on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DAEDALUS_GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('/tmp/daedalus-review.md', 'utf8');
            } catch(e) {
              body = '## Daedalus Review\n_Daedalus was unable to complete the review._\n';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Daedalus applies labels and self-assigns
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DAEDALUS_GITHUB_TOKEN }}
          script: |
            const reviewStatus = '${{ steps.daedalus.outputs.status }}';
            const labels = ['daedalus-reviewed'];
            if (reviewStatus === 'NEEDS_WORK') labels.push('needs-changes');
            if (reviewStatus === 'NOT_READY') labels.push('blocked');
            if (reviewStatus === 'READY') labels.push('ready-to-merge');

            for (const label of ['needs-changes', 'blocked', 'ready-to-merge']) {
              try {
                await github.rest.issues.removeLabel({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch(e) {
                if (e.status !== 404) console.log(`Could not remove ${label}: ${e.message}`);
              }
            }

            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            } catch(e) {
              console.log('Could not add labels: ' + e.message);
            }

            try {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                assignees: ['daedalus-Idos']
              });
            } catch(e) {
              console.log('Could not self-assign: ' + e.message);
            }

      - name: Daedalus configures git identity for future commits
        run: |
          git config user.name "daedalus-Idos"
          git config user.email "goneroguendakese@gmail.com"
