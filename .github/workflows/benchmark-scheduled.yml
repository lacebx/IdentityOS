name: Scheduled IdentityBench

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 1'
    - cron: '0 4 1 * *'

env:
  BENCHMARK_IDENTITY: "benchmark-bot"

permissions:
  contents: read

jobs:
  nightly-smoke:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Restore identity state from cache
        uses: actions/cache@v4
        id: nightly-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-${{ env.BENCHMARK_IDENTITY }}-nightly-${{ github.run_id }}
          restore-keys: |
            benchmark-${{ env.BENCHMARK_IDENTITY }}-nightly-
            benchmark-${{ env.BENCHMARK_IDENTITY }}-

      - name: Create benchmark identity (first run only)
        run: |
          if identity inspect ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run nightly smoke benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .identitybench/reports
          identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode smoke --seed 42 2>&1
          identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-nightly.md"
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance.md"

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark
          path: .identitybench/

  weekly-full:
    if: github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Restore identity state from cache
        uses: actions/cache@v4
        id: weekly-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-${{ env.BENCHMARK_IDENTITY }}-weekly-${{ github.run_id }}
          restore-keys: |
            benchmark-${{ env.BENCHMARK_IDENTITY }}-weekly-
            benchmark-${{ env.BENCHMARK_IDENTITY }}-

      - name: Create benchmark identity (first run only)
        run: |
          if identity inspect ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run weekly full benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .identitybench/reports
          identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode full --seed 42 2>&1
          identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-weekly.md"
          identitybench history ${{ env.BENCHMARK_IDENTITY }}
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance.md"

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-benchmark
          path: .identitybench/

  monthly-endurance:
    if: github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Restore identity state from cache
        uses: actions/cache@v4
        id: monthly-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-${{ env.BENCHMARK_IDENTITY }}-monthly-${{ github.run_id }}
          restore-keys: |
            benchmark-${{ env.BENCHMARK_IDENTITY }}-monthly-
            benchmark-${{ env.BENCHMARK_IDENTITY }}-

      - name: Create benchmark identity (first run only)
        run: |
          if identity inspect ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run monthly endurance benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .identitybench/reports
          for i in 1 2 3; do
            identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode full --seed $((41 + i)) 2>&1
            identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance-run$i.md"
          done
          identitybench compare --id ${{ env.BENCHMARK_IDENTITY }} --last 3 2>&1
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance.md"

      - uses: actions/upload-artifact@v4
        with:
          name: monthly-endurance-benchmark
          path: .identitybench/
