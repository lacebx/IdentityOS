name: Scheduled IdentityBench

on:
  schedule:
    - cron: '0 3 * * 1'
    - cron: '0 4 1 * *'

env:
  BENCHMARK_IDENTITY: "benchmark-bot"
  GROQ_MODEL: "openai/gpt-oss-20b"
  BENCHMARK_MODEL_KEY: "gpt-oss-20b"

concurrency:
  group: identityos-provider
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  weekly-full:
    if: github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Restore identity state from cache
        uses: actions/cache@v4
        id: weekly-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-weekly-${{ env.BENCHMARK_IDENTITY }}-${{ env.BENCHMARK_MODEL_KEY }}-${{ hashFiles('identitybench/**', '.github/workflows/benchmark-scheduled.yml') }}-${{ github.run_id }}
          restore-keys: |
            benchmark-weekly-${{ env.BENCHMARK_IDENTITY }}-${{ env.BENCHMARK_MODEL_KEY }}-${{ hashFiles('identitybench/**', '.github/workflows/benchmark-scheduled.yml') }}-

      - name: Create benchmark identity (first run only)
        run: |
          if identity inspect --id ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run weekly full benchmark
        id: weekly-benchmark
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p .identitybench/reports
          identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode full --seed 42 2>&1 | tee .identitybench/reports/weekly-runtime.txt
          identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-weekly.md"
          identitybench history ${{ env.BENCHMARK_IDENTITY }}
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance.md"

      - name: Package weekly evidence for attestation
        id: weekly-package
        if: ${{ always() && !cancelled() }}
        run: tar -czf weekly-benchmark-evidence.tar.gz .identitybench/

      - name: Attest weekly diagnostic evidence
        if: ${{ always() && !cancelled() && steps.weekly-package.outcome == 'success' }}
        uses: actions/attest@v4
        with:
          subject-path: weekly-benchmark-evidence.tar.gz

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && steps.weekly-package.outcome == 'success' }}
        with:
          name: weekly-benchmark
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .identitybench/
            weekly-benchmark-evidence.tar.gz

      - name: Report weekly runtime failure after preserving evidence
        if: ${{ always() && steps.weekly-benchmark.outcome == 'failure' }}
        run: |
          echo "::error::Weekly benchmark execution failed; raw evidence was preserved."
          exit 1

  monthly-endurance:
    if: github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Restore identity state from cache
        uses: actions/cache@v4
        id: monthly-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-monthly-${{ env.BENCHMARK_IDENTITY }}-${{ env.BENCHMARK_MODEL_KEY }}-${{ hashFiles('identitybench/**', '.github/workflows/benchmark-scheduled.yml') }}-${{ github.run_id }}
          restore-keys: |
            benchmark-monthly-${{ env.BENCHMARK_IDENTITY }}-${{ env.BENCHMARK_MODEL_KEY }}-${{ hashFiles('identitybench/**', '.github/workflows/benchmark-scheduled.yml') }}-

      - name: Create benchmark identity (first run only)
        run: |
          if identity inspect --id ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run monthly endurance benchmark
        id: monthly-benchmark
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p .identitybench/reports
          for i in 1 2 3; do
            identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode full --seed $((41 + i)) 2>&1 | tee ".identitybench/reports/monthly-runtime-run${i}.txt"
            identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance-run$i.md"
          done
          identitybench compare --id ${{ env.BENCHMARK_IDENTITY }} --last 3 2>&1
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o ".identitybench/reports/${{ env.BENCHMARK_IDENTITY }}-endurance.md"

      - name: Package endurance evidence for attestation
        id: monthly-package
        if: ${{ always() && !cancelled() }}
        run: tar -czf monthly-endurance-evidence.tar.gz .identitybench/

      - name: Attest endurance diagnostic evidence
        if: ${{ always() && !cancelled() && steps.monthly-package.outcome == 'success' }}
        uses: actions/attest@v4
        with:
          subject-path: monthly-endurance-evidence.tar.gz

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && steps.monthly-package.outcome == 'success' }}
        with:
          name: monthly-endurance-benchmark
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .identitybench/
            monthly-endurance-evidence.tar.gz

      - name: Report monthly runtime failure after preserving evidence
        if: ${{ always() && steps.monthly-benchmark.outcome == 'failure' }}
        run: |
          echo "::error::Monthly benchmark execution failed; raw evidence was preserved."
          exit 1
