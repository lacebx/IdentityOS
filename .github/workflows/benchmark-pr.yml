name: IdentityBench PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Trusted branch, tag, or SHA to benchmark"
        required: true
        type: string

env:
  BENCHMARK_IDENTITY: "benchmark-bot"
  GROQ_MODEL: "openai/gpt-oss-20b"
  BENCHMARK_MODEL_KEY: "gpt-oss-20b"
  BENCHMARK_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
  CAN_RUN_PROVIDER_BENCHMARK: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

concurrency:
  group: identityos-provider
  cancel-in-progress: false
  queue: max

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.target_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore identity state from cache
        if: env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        uses: actions/cache@v4
        id: identity-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-pr-${{ env.BENCHMARK_IDENTITY }}-${{ env.BENCHMARK_MODEL_KEY }}-${{ env.BENCHMARK_BASELINE_REF }}-${{ hashFiles('identitybench/**', '.github/workflows/benchmark-pr.yml') }}-${{ github.run_id }}
          restore-keys: |
            benchmark-pr-${{ env.BENCHMARK_IDENTITY }}-${{ env.BENCHMARK_MODEL_KEY }}-${{ env.BENCHMARK_BASELINE_REF }}-${{ hashFiles('identitybench/**', '.github/workflows/benchmark-pr.yml') }}-

      - name: Create benchmark identity (first run only)
        if: env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        run: |
          if identity inspect --id ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee test-results.txt

      - name: Run integration tests
        run: |
          set -o pipefail
          python -m pytest tests/test_runtime_pipeline.py -v --tb=short 2>&1 | tee integration-results.txt

      - name: Run IdentityBench smoke suite
        if: env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode smoke --seed 42 2>&1 | tee benchmark-results.txt
          identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o benchmark-report.md
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o endurance-report.md

      - name: Compare against restored benchmark history
        if: env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        id: compare
        run: |
          set -o pipefail
          identitybench compare --id ${{ env.BENCHMARK_IDENTITY }} --last 2 --baseline champion 2>&1 | tee regression-check.txt

      - name: Report advisory regression observations
        if: env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        run: |
          if [ -f regression-check.txt ] && grep -q "REGRESSION" regression-check.txt; then
            echo "::warning::Single-run score regression against the verified observed champion. The champion was retained; only the protected paired gate has promotion authority."
          fi

      - name: Upload benchmark artifacts
        if: env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          include-hidden-files: true
          if-no-files-found: error
          path: |
            benchmark-report.md
            benchmark-results.txt
            endurance-report.md
            regression-check.txt
            .identitybench/

      - name: Comment benchmark summary on PR
        if: github.event_name == 'pull_request' && env.CAN_RUN_PROVIDER_BENCHMARK == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              const results = fs.readFileSync('benchmark-results.txt', 'utf8');
              summary = '## IdentityBench Results\n```\n' + results.slice(-1500) + '\n```\n';
            } catch(e) {
              summary = '## IdentityBench Results\n_Benchmark completed but summary unavailable._\n';
            }
            try {
              const report = fs.readFileSync('benchmark-report.md', 'utf8');
              const lines = report.split('\n').slice(0, 40).join('\n');
              summary += '\n### Report Excerpt\n' + lines;
            } catch(e) {}
            try {
              const endurance = fs.readFileSync('endurance-report.md', 'utf8');
              const lines = endurance.split('\n').slice(0, 28).join('\n');
              summary += '\n### Endurance Health\n' + lines;
            } catch(e) {}
            try {
              const comparison = fs.readFileSync('regression-check.txt', 'utf8');
              summary += '\n### Verified Observed Champion Comparison\n```\n' + comparison.slice(-2000) + '\n```\n';
            } catch(e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Explain fork benchmark boundary
        if: github.event_name == 'pull_request' && env.CAN_RUN_PROVIDER_BENCHMARK != 'true'
        run: |
          {
            echo "## Provider benchmark intentionally not executed"
            echo
            echo "This pull request originates from a fork. GitHub correctly withholds provider credentials from untrusted code."
            echo "Unit and integration tests above are authoritative for this job; no benchmark score or champion promotion is claimed."
            echo "A maintainer can push the reviewed commit to a trusted repository branch and run this workflow manually with target_ref."
          } >> "$GITHUB_STEP_SUMMARY"
