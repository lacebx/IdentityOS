name: IdentityBench PR Check

on:
  pull_request:
    branches: [main]

env:
  BENCHMARK_IDENTITY: "benchmark-bot"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore identity state from cache
        uses: actions/cache@v4
        id: identity-cache
        with:
          path: |
            .identity_store/
            .identitybench/
          key: benchmark-${{ env.BENCHMARK_IDENTITY }}-${{ github.base_ref }}-${{ hashFiles('identitybench/**/*.py') }}
          restore-keys: |
            benchmark-${{ env.BENCHMARK_IDENTITY }}-${{ github.base_ref }}-
            benchmark-${{ env.BENCHMARK_IDENTITY }}-

      - name: Create benchmark identity (first run only)
        run: |
          if identity inspect ${{ env.BENCHMARK_IDENTITY }} >/dev/null 2>&1; then
            echo "Reusing persisted identity ${{ env.BENCHMARK_IDENTITY }}."
          else
            identity create --name "BenchmarkBot" --id ${{ env.BENCHMARK_IDENTITY }} --persona "benchmark"
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee test-results.txt

      - name: Run integration tests
        run: |
          set -o pipefail
          python -m pytest tests/test_runtime_pipeline.py -v --tb=short 2>&1 | tee integration-results.txt

      - name: Run IdentityBench smoke suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          identitybench run ${{ env.BENCHMARK_IDENTITY }} --mode smoke --seed 42 2>&1 | tee benchmark-results.txt
          identitybench report ${{ env.BENCHMARK_IDENTITY }} --markdown -o benchmark-report.md
          identitybench endurance report ${{ env.BENCHMARK_IDENTITY }} -o endurance-report.md

      - name: Compare against restored benchmark history
        id: compare
        run: |
          set -o pipefail
          identitybench compare --id ${{ env.BENCHMARK_IDENTITY }} --last 2 2>&1 | tee regression-check.txt

      - name: Check for regressions
        run: |
          if [ -f regression-check.txt ] && grep -q "REGRESSION" regression-check.txt; then
            echo "::error::Critical metric regression detected. Review benchmark report."
            exit 1
          fi

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-report.md
            benchmark-results.txt
            endurance-report.md
            regression-check.txt
            .identitybench/

      - name: Comment benchmark summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              const results = fs.readFileSync('benchmark-results.txt', 'utf8');
              summary = '## IdentityBench Results\n```\n' + results.slice(-1500) + '\n```\n';
            } catch(e) {
              summary = '## IdentityBench Results\n_Benchmark completed but summary unavailable._\n';
            }
            try {
              const report = fs.readFileSync('benchmark-report.md', 'utf8');
              const lines = report.split('\n').slice(0, 40).join('\n');
              summary += '\n### Report Excerpt\n' + lines;
            } catch(e) {}
            try {
              const endurance = fs.readFileSync('endurance-report.md', 'utf8');
              const lines = endurance.split('\n').slice(0, 28).join('\n');
              summary += '\n### Endurance Health\n' + lines;
            } catch(e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
