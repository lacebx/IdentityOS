name: IdentityBench Paired Integrity

on:
  schedule:
    # Two quota-bounded observations, offset from the top of the hour.
    - cron: "17 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: identitybench-paired-integrity
  cancel-in-progress: false

env:
  GROQ_MODEL: "openai/gpt-oss-20b"
  # Scheduled observations cannot promote and use one pair. A manual audit
  # exercises all three mandatory pairs without weakening the gate's floor.
  INTEGRITY_TRIALS: ${{ github.event_name == 'schedule' && '1' || '3' }}
  IDENTITYBENCH_CONTEXT_TOKENS: "256"
  IDENTITYBENCH_RESPONSE_TOKENS: "128"
  IDENTITYBENCH_TOOL_RESULT_CHARS: "256"
  IDENTITYBENCH_TOOLS_PER_REQUEST: "1"
  IDENTITYBENCH_COOLDOWN_WAIT_SECONDS: "180"

jobs:
  prepare:
    # Never execute a manually selected feature branch with provider credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      base_sha: ${{ steps.refs.outputs.base_sha }}
      candidate_sha: ${{ steps.refs.outputs.candidate_sha }}
      evaluator_digest: ${{ steps.evaluator.outputs.digest }}
      trial_count: ${{ steps.refs.outputs.trial_count }}
      trial_matrix: ${{ steps.refs.outputs.trial_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install trusted evaluator
        run: python -m pip install -e ".[dev]"

      - name: Freeze comparison commits
        id: refs
        shell: bash
        run: |
          candidate_sha="${GITHUB_SHA}"
          base_sha="$(git rev-parse "${candidate_sha}^1")"
          if [[ ! "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]] || [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Integrity comparisons require full frozen commit SHAs."
            exit 1
          fi
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo 'trial_count=1' >> "${GITHUB_OUTPUT}"
            echo 'trial_matrix={"include":[{"trial":1,"side":"base"},{"trial":1,"side":"candidate"}]}' >> "${GITHUB_OUTPUT}"
          else
            echo "trial_count=${INTEGRITY_TRIALS}" >> "${GITHUB_OUTPUT}"
            echo 'trial_matrix={"include":[{"trial":1,"side":"base"},{"trial":1,"side":"candidate"},{"trial":2,"side":"base"},{"trial":2,"side":"candidate"},{"trial":3,"side":"base"},{"trial":3,"side":"candidate"}]}' >> "${GITHUB_OUTPUT}"
          fi

      - name: Fingerprint evaluator
        id: evaluator
        shell: bash
        run: |
          digest="$(python -c 'from identitybench.provenance import suite_fingerprint; print(suite_fingerprint())')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Commit randomized trials and scan candidate diff
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate_sha }}
          EVALUATOR_DIGEST: ${{ steps.evaluator.outputs.digest }}
          TRIAL_COUNT: ${{ steps.refs.outputs.trial_count }}
        shell: bash
        run: |
          mkdir -p integrity-plan
          identitybench integrity plan \
            --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --window-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --beacon "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --evaluator-digest "${EVALUATOR_DIGEST}" \
            --trials "${TRIAL_COUNT}" \
            --commitments integrity-plan/seed-commitments.json \
            --reveal integrity-plan/seed-reveal.json
          git diff --no-ext-diff "${BASE_SHA}" "${CANDIDATE_SHA}" > integrity-plan/candidate.diff
          identitybench integrity scan \
            --diff-file integrity-plan/candidate.diff \
            --output integrity-plan/diff-scan.json

      - name: Attest seed commitments before execution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: integrity-plan/seed-commitments.json

      - name: Upload committed trial plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrity-plan-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: integrity-plan/

  paired-trials:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.trial_matrix) }}
    steps:
      - name: Download committed trial plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrity-plan-${{ github.run_id }}
          path: integrity-plan

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Resolve and verify committed trial
        id: trial
        env:
          TRIAL_INDEX: ${{ matrix.trial }}
        shell: bash
        run: |
          python - "${TRIAL_INDEX}" "${GITHUB_OUTPUT}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          index = int(sys.argv[1])
          output = Path(sys.argv[2])
          commitments = json.loads(Path("integrity-plan/seed-commitments.json").read_text())
          reveal = json.loads(Path("integrity-plan/seed-reveal.json").read_text())
          plan_material = dict(commitments)
          claimed_plan_digest = plan_material.pop("plan_digest")
          encoded_plan = json.dumps(
              plan_material,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode()
          if hashlib.sha256(encoded_plan).hexdigest() != claimed_plan_digest:
              raise SystemExit("invalid plan digest")
          if commitments["plan_digest"] != reveal["plan_digest"]:
              raise SystemExit("plan digest mismatch")
          committed = {item["trial_index"]: item for item in commitments["trials"]}[index]
          trial = {item["trial_index"]: item for item in reveal["trials"]}[index]
          encoded = json.dumps(
              {"nonce": trial["nonce"], "seed": trial["seed"], "trial_index": index},
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          observed = hashlib.sha256(encoded).hexdigest()
          if observed != committed["seed_commitment"]:
              raise SystemExit("seed commitment mismatch")
          with output.open("a") as handle:
              handle.write(f"seed={trial['seed']}\n")
              handle.write(f"seed_commitment={trial['seed_commitment']}\n")
          PY

      - name: Check out frozen runtime side
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.side == 'base' && needs.prepare.outputs.base_sha || needs.prepare.outputs.candidate_sha }}
          path: source

      - name: Install frozen runtime side
        run: python -m pip install -e "./source[dev]"

      - name: Create fresh equivalent identity
        env:
          BENCHMARK_IDENTITY: integrity-${{ github.run_id }}-${{ matrix.trial }}-${{ matrix.side }}
        shell: bash
        run: |
          cd source
          identity create \
            --name "Integrity Benchmark" \
            --id "${BENCHMARK_IDENTITY}" \
            --persona "paired benchmark"

      - name: Execute frozen runtime side
        id: benchmark
        continue-on-error: true
        env:
          BENCHMARK_IDENTITY: integrity-${{ github.run_id }}-${{ matrix.trial }}-${{ matrix.side }}
          RUN_SHA: ${{ matrix.side == 'base' && needs.prepare.outputs.base_sha || needs.prepare.outputs.candidate_sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          EVALUATOR_DIGEST: ${{ needs.prepare.outputs.evaluator_digest }}
          TRIAL_INDEX: ${{ matrix.trial }}
          SEED: ${{ steps.trial.outputs.seed }}
          SEED_COMMITMENT: ${{ steps.trial.outputs.seed_commitment }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          IDENTITYBENCH_COMMIT_SHA: ${{ matrix.side == 'base' && needs.prepare.outputs.base_sha || needs.prepare.outputs.candidate_sha }}
          IDENTITYBENCH_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          IDENTITYBENCH_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          IDENTITYBENCH_EVALUATOR_DIGEST: ${{ needs.prepare.outputs.evaluator_digest }}
          IDENTITYBENCH_LANE: public
          IDENTITYBENCH_TRIAL_INDEX: ${{ matrix.trial }}
          IDENTITYBENCH_SEED_COMMITMENT: ${{ steps.trial.outputs.seed_commitment }}
          IDENTITYBENCH_IDENTITY_STATE_ORIGIN: fresh-paired-trial
        shell: bash
        run: |
          set -o pipefail
          cd source
          identitybench run "${BENCHMARK_IDENTITY}" --mode smoke --seed "${SEED}" 2>&1 | tee "../trial-output.txt"

      - name: Preserve observed runtime result
        id: collect
        if: ${{ always() && !cancelled() }}
        env:
          BENCHMARK_IDENTITY: integrity-${{ github.run_id }}-${{ matrix.trial }}-${{ matrix.side }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          RUN_SHA: ${{ matrix.side == 'base' && needs.prepare.outputs.base_sha || needs.prepare.outputs.candidate_sha }}
        shell: bash
        run: |
          mkdir -p paired-evidence
          cd source
          run_file="$(find ".identitybench/runs/${BENCHMARK_IDENTITY}" -type f -name '*.json' -print -quit)"
          if [[ -z "${run_file}" ]]; then
            echo "::error::Benchmark did not produce raw evidence."
            exit 1
          fi
          cp "${run_file}" ../paired-evidence/run.json
          cp ../trial-output.txt ../paired-evidence/runtime-output.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("../paired-evidence/execution-status.json").write_text(
              json.dumps({
                  "benchmark_outcome": os.environ["BENCHMARK_OUTCOME"],
                  "run_sha": os.environ["RUN_SHA"],
              }, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Attest raw runtime evidence
        if: ${{ always() && steps.collect.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: paired-evidence/run.json

      - name: Upload raw paired evidence
        if: ${{ always() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-run-${{ matrix.side }}-${{ matrix.trial }}
          if-no-files-found: error
          retention-days: 90
          path: paired-evidence/

      - name: Report runtime failure after preserving evidence
        if: ${{ always() && !cancelled() && (steps.benchmark.outcome != 'success' || steps.collect.outcome != 'success') }}
        run: |
          echo "::error::The benchmark trial failed; its observed evidence was preserved when available."
          exit 1

  evaluate:
    needs: [prepare, paired-trials]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install trusted evaluator
        run: python -m pip install -e ".[dev]"

      - name: Download committed trial plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrity-plan-${{ github.run_id }}
          path: integrity-plan

      - name: Download every attempted trial
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: paired-run-*
          path: downloaded-pairs

      - name: Normalize complete pair set
        env:
          TRIAL_COUNT: ${{ needs.prepare.outputs.trial_count }}
        shell: bash
        run: |
          for trial in $(seq 1 "${TRIAL_COUNT}"); do
            mkdir -p "pairs/trial-${trial}"
            for side in base candidate; do
              source="downloaded-pairs/paired-run-${side}-${trial}/run.json"
              if [[ -f "${source}" ]]; then
                cp "${source}" "pairs/trial-${trial}/${side}.json"
              else
                echo "::warning::Missing ${side} evidence for trial ${trial}; the gate will record it as ineligible."
              fi
            done
          done

      - name: Restore append-only ledger
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .identitybench/integrity/
          key: identitybench-integrity-ledger-v1-${{ github.run_id }}
          restore-keys: |
            identitybench-integrity-ledger-v1-

      - name: Independently rescore and append advisory decision
        shell: bash
        run: |
          mkdir -p integrity-results .identitybench/integrity
          identitybench integrity gate \
            --commitments integrity-plan/seed-commitments.json \
            --reveal integrity-plan/seed-reveal.json \
            --pairs-dir pairs \
            --diff-scan integrity-plan/diff-scan.json \
            --output integrity-results/decision.json \
            --summary integrity-results/summary.md \
            --ledger .identitybench/integrity/ledger.jsonl
          identitybench integrity verify-ledger \
            --ledger .identitybench/integrity/ledger.jsonl
          cat integrity-results/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest independent decision
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: integrity-results/decision.json

      - name: Attest append-only ledger head
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .identitybench/integrity/ledger.jsonl

      - name: Upload complete integrity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-integrity-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            integrity-plan/
            integrity-results/
            pairs/
            .identitybench/integrity/

      - name: Publish rolling engineering finding
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const decision = JSON.parse(fs.readFileSync('integrity-results/decision.json', 'utf8'));
            const summary = fs.readFileSync('integrity-results/summary.md', 'utf8');
            const title = '[IdentityBench] Continuous paired-integrity findings';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${summary}\n## Runtime provenance\n\n- Candidate: \`${decision.candidate_sha}\`\n- Base: \`${decision.base_sha}\`\n- Decision digest: \`${decision.decision_digest}\`\n- [Workflow evidence](${runUrl})\n\nThis issue is observational. It cannot authorize merge or promotion.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['benchmark']
              });
            }
