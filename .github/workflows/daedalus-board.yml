name: Daedalus Engineering Board Sync

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  sync-board:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      projects: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Sync Daedalus goals to Engineering Board
        env:
          DAEDALUS_GITHUB_TOKEN: ${{ secrets.DAEDALUS_GITHUB_TOKEN }}
        run: |
          python scripts/daedalus_board.py sync 2>&1 | tee /tmp/board-sync.txt
          echo "Board sync complete"
