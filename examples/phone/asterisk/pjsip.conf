; Asterisk 22.6+ with AudioSocket DTMF support. Merge into your PBX configuration.
; Replace LAN_IP and LOCAL_SIP_PASSWORD; do not publish the filled-in file.
[idos-lan]
type=transport
protocol=udp
bind=LAN_IP:5060

[1001]
type=endpoint
transport=idos-lan
context=idos-caller-1001
disallow=all
allow=ulaw
auth=idos-auth-1001
aors=1001
dtmf_mode=rfc4733
direct_media=no
force_rport=yes
rtp_symmetric=yes
rewrite_contact=yes

[idos-auth-1001]
type=auth
auth_type=userpass
username=1001
password=LOCAL_SIP_PASSWORD

[1001]
type=aor
max_contacts=1
remove_existing=yes
